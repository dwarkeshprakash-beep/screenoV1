<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280"/>
<title>Screeno · v2 Prototype</title>

<link rel="stylesheet" href="tokens.css"/>

<style>
/* ── reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;background:#F8FAFC;color:#374151}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#root{min-height:100vh;display:flex;flex-direction:column}

/* ── global animations ── */
@keyframes v2fade    {from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes v2scale   {from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes v2slide   {from{transform:translate(-50%,60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes v2spin    {from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes v2pulse   {0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes v2fadein  {from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes v2pop     {from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes v2check   {to{stroke-dashoffset:0}}

/* ── scrollbars ── */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:9999px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#94A3B8;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ── text selection ── */
::selection{background:#DEDAFB;color:#3A31A3}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Data must load first -->
<script type="text/babel" src="src/v2/v2-data.jsx"></script>
<!-- Shell: nav, layouts, modals -->
<script type="text/babel" src="src/v2/v2-shell.jsx"></script>
<!-- Manager screens -->
<script type="text/babel" src="src/v2/v2-manager.jsx"></script>
<!-- Schedule + CSV modals -->
<script type="text/babel" src="src/v2/v2-schedule.jsx"></script>
<!-- Candidate screens -->
<script type="text/babel" src="src/v2/v2-candidate.jsx"></script>
<!-- Monthly Assessment screens -->
<script type="text/babel" src="src/v2/v2-monthly.jsx"></script>
<!-- Client Interview screens -->
<script type="text/babel" src="src/v2/v2-clients.jsx"></script>
<!-- Interviewer screens -->
<script type="text/babel" src="src/v2/v2-interviewer.jsx"></script>
<!-- App router — mounts last -->
<script type="text/babel" src="src/v2/v2-app.jsx"></script>
</body>
</html>
